name: Bug report
description: Something does not work with Gitphin Droid
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Gitphin Droid version (Settings > About), Android version, phone model, git version on the PC"
      placeholder: "Gitphin Droid 1.0.0, Android 15, Pixel 8, git 2.x"
    validations: {required: true}
  - type: dropdown
    id: link
    attributes:
      label: How do you connect?
      options:
        - On the phone (the app itself)
        - USB cable (gitphin-usb)
        - USB tethering
        - Wi-Fi
    validations: {required: true}
  - type: input
    id: pc
    attributes: {label: PC, placeholder: "Arch Linux / Windows 11 / macOS 15, browser"}
  - type: textarea
    id: what
    attributes: {label: What happened, and what did you expect?, description: "The git command or the page you used, and the answer you got."}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: "The git output with `GIT_TRACE_CURL=1`, or for the USB helper `journalctl --user -u gitphin-usb -b --no-pager | tail -50`. Remove passwords."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Background running is allowed for Gitphin (Settings > Start)
        - label: The top bar of the app shows the address I used
